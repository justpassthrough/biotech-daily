name: Daily biotech briefing

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 08:00 KST (다음 날)
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write           # data/, docs/ commit 권한

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run biotech_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: 'true'
        run: python biotech_daily.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "daily: $(date -u +%Y-%m-%d) briefing"
            git pull --rebase origin main || true
            git push
          fi

      # 성공 시: 오늘 요약을 텔레그램으로. 이 메시지가 매일 오는 것 = 정상 신호.
      - name: Notify success summary
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_run.py

      # 실패 시: 조용히 멈추지 않게 경고. API 잔액 소진·스크랩 오류 등을 즉시 알림.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests -q || true
          python -c "from notify_telegram import send; send('⚠️ biotech-daily 실패 — 오늘 브리핑이 안 만들어졌습니다.\nAPI 잔액 소진/스크랩 오류 가능. Actions 로그 확인:\nhttps://github.com/justpassthrough/biotech-daily/actions')"
