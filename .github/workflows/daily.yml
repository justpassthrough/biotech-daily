name: Daily biotech briefing

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 08:00 KST (다음 날)
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write           # data/, docs/ commit 권한

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run biotech_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: 'true'
        run: python biotech_daily.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "daily: $(date -u +%Y-%m-%d) briefing"
            git pull --rebase origin main || true
            git push
          fi
